[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deeppulse-crm"
version = "0.1.0"
description = "Sequence-based customer behaviour and dynamic pricing engine (deep learning successor of AnalyzeWise-CRM)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hakan Güneş" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lifelines>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Faz 1+ (derin öğrenme) — GPU'lu kurulum için README'deki PyTorch komutunu kullan
dl = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
